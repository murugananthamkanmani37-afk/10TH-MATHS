<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wanderly | Travel Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #12263a;
      --lagoon: #0e7c86;
      --lagoon-dark: #0a5f67;
      --mist: #eaf4f6;
      --sun: #f2b84b;
      --paper: #fbfdfd;
      --line: #d3e3e6;
      --muted: #5b7080;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--mist);
      color: var(--ink);
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 760px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .header {
      padding: 20px 24px 16px;
      background: var(--ink);
      color: #fff;
      position: relative;
    }

    .header h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .header p {
      margin-top: 2px;
      font-size: 0.9rem;
      color: #b9cdd6;
    }

    .header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: repeating-linear-gradient(
        90deg,
        var(--sun) 0 14px,
        transparent 14px 24px
      );
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .welcome {
      margin: auto 0;
      text-align: left;
    }

    .welcome h2 {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.7rem;
      line-height: 1.25;
      max-width: 22ch;
    }

    .welcome p {
      margin-top: 10px;
      color: var(--muted);
      max-width: 46ch;
      line-height: 1.55;
    }

    .suggestions {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      font: inherit;
      font-size: 0.9rem;
      padding: 9px 14px;
      border: 1px solid var(--lagoon);
      border-radius: 999px;
      background: transparent;
      color: var(--lagoon-dark);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .chip:hover {
      background: var(--lagoon);
      color: #fff;
    }

    .message {
      max-width: 85%;
      padding: 11px 15px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 0.97rem;
      overflow-wrap: anywhere;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--mist);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }

    .message.user {
      align-self: flex-end;
      background: var(--lagoon);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.error {
      background: #fdeceb;
      border-color: #f2c4c0;
      color: #8a2a22;
    }

    .message p + p,
    .message p + ul,
    .message ul + p,
    .message p + ol,
    .message ol + p {
      margin-top: 8px;
    }

    .message ul,
    .message ol {
      padding-left: 20px;
    }

    .message li + li {
      margin-top: 3px;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      padding: 4px 2px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lagoon);
      animation: bounce 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        opacity: 0.35;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 14px 24px 18px;
      border-top: 1px solid var(--line);
      background: var(--paper);
    }

    .composer input {
      flex: 1;
      font: inherit;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
    }

    .composer input::placeholder {
      color: #8aa0ab;
    }

    .composer button {
      font: inherit;
      font-weight: 600;
      padding: 0 22px;
      border: none;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    .composer button:hover:not(:disabled) {
      background: var(--lagoon-dark);
    }

    .composer button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--sun);
      outline-offset: 2px;
    }

    @media (max-width: 600px) {
      .header,
      .messages,
      .composer {
        padding-left: 16px;
        padding-right: 16px;
      }

      .message {
        max-width: 92%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Wanderly</h1>
      <p>Your travel and tourism assistant</p>
    </header>

    <section class="messages" id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <h2>Where would you like to go next?</h2>
        <p>Ask about destinations, itineraries, budgets, stays, food, transport, or travel tips.</p>
        <div class="suggestions">
          <button class="chip" type="button">Plan a 5-day trip to Kerala</button>
          <button class="chip" type="button">Best time to visit Japan</button>
          <button class="chip" type="button">Budget tips for backpacking Europe</button>
          <button class="chip" type="button">What to pack for a Himalayan trek</button>
        </div>
      </div>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <input
        type="text"
        id="input"
        placeholder="Ask about your next trip"
        maxlength="1000"
        aria-label="Your message"
        required
      >
      <button type="submit" id="send">Send</button>
    </form>
  </main>

  <script>
    const messagesEl = document.getElementById("messages");
    const welcomeEl = document.getElementById("welcome");
    const formEl = document.getElementById("composer");
    const inputEl = document.getElementById("input");
    const sendEl = document.getElementById("send");

    const history = [];
    let isWaiting = false;

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatInline(text) {
      return text
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>");
    }

    function formatMessage(text) {
      const lines = escapeHtml(text).split("\n");
      let html = "";
      let listType = null;

      const closeList = () => {
        if (listType) {
          html += `</${listType}>`;
          listType = null;
        }
      };

      for (const rawLine of lines) {
        const line = rawLine.trim();
        const bullet = line.match(/^[-*•]\s+(.*)/);
        const numbered = line.match(/^\d+[.)]\s+(.*)/);

        if (bullet || numbered) {
          const type = bullet ? "ul" : "ol";
          if (listType !== type) {
            closeList();
            html += `<${type}>`;
            listType = type;
          }
          html += `<li>${formatInline((bullet || numbered)[1])}</li>`;
        } else if (line) {
          closeList();
          html += `<p>${formatInline(line)}</p>`;
        } else {
          closeList();
        }
      }

      closeList();
      return html;
    }

    function addMessage(text, sender, isError = false) {
      const el = document.createElement("div");
      el.className = `message ${sender}${isError ? " error" : ""}`;

      if (sender === "bot") {
        el.innerHTML = formatMessage(text);
      } else {
        el.textContent = text;
      }

      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    function addTypingIndicator() {
      const el = document.createElement("div");
      el.className = "message bot";
      el.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    function setWaiting(state) {
      isWaiting = state;
      sendEl.disabled = state;
      inputEl.disabled = state;
      if (!state) {
        inputEl.focus();
      }
    }

    async function sendMessage(message) {
      if (isWaiting || !message) {
        return;
      }

      if (welcomeEl) {
        welcomeEl.remove();
      }

      addMessage(message, "user");
      inputEl.value = "";
      setWaiting(true);
      const typingEl = addTypingIndicator();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        const data = await response.json();
        typingEl.remove();

        if (!response.ok) {
          addMessage(data.error || "Something went wrong. Please try again.", "bot", true);
          return;
        }

        addMessage(data.reply, "bot");
        history.push({ role: "user", text: message });
        history.push({ role: "model", text: data.reply });
      } catch (error) {
        typingEl.remove();
        addMessage("Could not reach the server. Check your connection and try again.", "bot", true);
      } finally {
        setWaiting(false);
      }
    }

    formEl.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(inputEl.value.trim());
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => sendMessage(chip.textContent));
    });
  </script>
</body>
</html>
